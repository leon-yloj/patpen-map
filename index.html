<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

https://unpkg.com/leaflet@1.9.4/dist/leaflet.css

<style>
html,body{
margin:0;
height:100%;
}

#map{
height:100vh;
}
</style>

</head>

<body>

<div id="map"></div>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

<script>

var map = L.map('map').setView(
[47.482,-2.475],
13
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

L.marker([
47.482,
-2.475
])
.addTo(map)
.bindPopup('PATPEN');

</script>

</body>
</html>
